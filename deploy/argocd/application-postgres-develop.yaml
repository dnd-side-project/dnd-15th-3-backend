apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dnd-15th-3-postgres-dev
  namespace: argocd
spec:
  project: dnd-15th-3
  source:
    repoURL: https://github.com/dnd-side-project/dnd-15th-3-backend.git
    targetRevision: develop
    path: deploy/k8s/postgres/overlays/develop
  destination:
    server: https://kubernetes.default.svc
    namespace: dnd-15th-3-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
