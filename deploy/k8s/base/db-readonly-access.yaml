apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-reader-shname
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: db-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["momo-postgres-0"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    resourceNames: ["momo-postgres-0"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: db-reader-shname
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: db-reader
subjects:
  - kind: ServiceAccount
    name: db-reader-shname
