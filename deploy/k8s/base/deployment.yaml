apiVersion: apps/v1
kind: Deployment
metadata:
  name: momo-api
  labels:
    app.kubernetes.io/name: momo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: momo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: momo-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: api
          image: ghcr.io/dnd-side-project/dnd-15th-3-backend:bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9464
          envFrom:
            - secretRef:
                name: momo-api-env
            - secretRef:
                name: momo-media-storage
          env:
            - name: PORT
              value: "3000"
            - name: SERVICE_NAME
              value: momo-api
            - name: LOG_FORMAT
              value: json
            - name: LOG_LEVEL
              value: log
            - name: METRICS_ENABLED
              value: "true"
            - name: METRICS_PORT
              value: "9464"
            - name: PLACE_PHOTO_PREVIEW_CONCURRENCY
              value: "10"
            - name: STATS_DB_HOST
              value: momo-statistics-postgres
            - name: STATS_DB_PORT
              value: "5432"
            - name: STATS_DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: momo-statistics-postgres-auth
                  key: POSTGRES_DB
            - name: STATS_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: momo-statistics-postgres-auth
                  key: POSTGRES_USER
            - name: STATS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: momo-statistics-postgres-auth
                  key: POSTGRES_PASSWORD
            - name: STATS_DB_SSL
              value: "false"
            - name: STATS_DB_SYNCHRONIZE
              value: "false"
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
