apiVersion: apps/v1
kind: Deployment
metadata:
  name: momo-place-sync-worker
  labels:
    app.kubernetes.io/name: momo-place-sync-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: momo-place-sync-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: momo-place-sync-worker
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: worker
          image: ghcr.io/dnd-side-project/dnd-15th-3-backend:bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9464
          command:
            - node
            - dist/place/place-sync-worker.js
          envFrom:
            - secretRef:
                name: momo-api-env
            - secretRef:
                name: momo-media-storage
          env:
            - name: SERVICE_NAME
              value: momo-place-sync-worker
            - name: LOG_FORMAT
              value: json
            - name: LOG_LEVEL
              value: log
            - name: METRICS_ENABLED
              value: "true"
            - name: METRICS_PORT
              value: "9464"
          startupProbe:
            httpGet:
              path: /health/live
              port: metrics
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/live
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: metrics
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
