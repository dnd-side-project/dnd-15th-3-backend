apiVersion: batch/v1
kind: Job
metadata:
  name: momo-statistics-migration
  labels:
    app.kubernetes.io/name: momo-statistics-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: momo-statistics-migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: ghcr.io/dnd-side-project/dnd-15th-3-backend:bootstrap
          imagePullPolicy: IfNotPresent
          command:
            - node
            - node_modules/typeorm/cli.js
            - migration:run
            - -d
            - dist/database/statistics-data-source.js
          env:
            - name: STATS_DB_HOST
              value: momo-statistics-postgres
            - name: STATS_DB_PORT
              value: "5432"
            - name: STATS_DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: momo-statistics-postgres-auth
                  key: POSTGRES_DB
            - name: STATS_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: momo-statistics-postgres-auth
                  key: POSTGRES_USER
            - name: STATS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: momo-statistics-postgres-auth
                  key: POSTGRES_PASSWORD
            - name: STATS_DB_SSL
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
