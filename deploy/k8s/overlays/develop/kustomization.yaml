apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dnd-15th-3-dev
resources:
  - ../../base
  - db-access.yaml
  - media-storage-secret.yaml
images:
  # develop 환경의 실제 태그는 Argo CD Image Updater가 Application 파라미터로
  # 자동 관리한다 (deploy/argocd/image-updater.yaml 참고).
  # 여기 값은 최초 부트스트랩용 placeholder이며 git에는 갱신하지 않는다.
  - name: ghcr.io/dnd-side-project/dnd-15th-3-backend
    newTag: develop-63a7d1be1574f815071f86dbff0ede6561d3c4a2
patches:
  - path: ingress.yaml
  - path: environment.yaml
  - path: worker-environment.yaml
  - path: statistics-worker-environment.yaml
  - target:
      kind: Role
      name: db-reader
    patch: |-
      - op: add
        path: /rules/-
        value:
          apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list"]
      - op: add
        path: /rules/-
        value:
          apiGroups: [""]
          resources: ["pods/log"]
          verbs: ["get"]
