apiVersion: batch/v1
kind: CronJob
metadata:
  name: momo-postgres-backup
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: upload
              env:
                - name: OCI_BUCKET_NAME
                  valueFrom:
                    secretKeyRef:
                      name: momo-api-env
                      key: OCI_BUCKET_NAME_DEV
                - name: BACKUP_ENV
                  value: dev
