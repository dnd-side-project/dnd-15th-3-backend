services:
  postgres:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: momo
      POSTGRES_DB: momo
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d momo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
