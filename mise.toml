[tools]
node = "24"
pnpm = "11.15.1"
postgres = "17"
redis = "7"
terraform = "latest"

[env]
_.file = ".env.development"
PGDATA = ".mise/data/postgres"

[tasks.setup]
description = "최초 프로젝트 환경 세팅"
run = [
  "mise install",
  "pnpm install",
  "mise run db-init",
]

[tasks.db-init]
description = "PostgreSQL 데이터 디렉토리 초기화 (최초 1회)"
run = [
  "mkdir -p .mise/data/postgres",
  "pg_ctl initdb -D .mise/data/postgres",
]

[tasks.db-start]
description = "로컬 PostgreSQL 시작"
run = "pg_ctl start -D .mise/data/postgres -l .mise/data/postgres/logfile -o '-k /tmp'"

[tasks.db-stop]
description = "로컬 PostgreSQL 중지"
run = "pg_ctl stop -D .mise/data/postgres"

[tasks.db-psql]
description = "PostgreSQL CLI 접속"
run = "psql -h /tmp"

[tasks.redis-start]
description = "로컬 Redis 시작"
run = "redis-server --daemonize yes"

[tasks.redis-stop]
description = "로컬 Redis 중지"
run = "redis-cli shutdown"

[tasks.redis-cli]
description = "Redis CLI 접속"
run = "redis-cli"

[tasks.ci]
description = "로컬에서 CI와 동일한 검증 실행"
run = [
  "biome check .",
  "pnpm run typecheck",
  "pnpm run test",
]
