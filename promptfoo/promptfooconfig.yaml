description: "코스 추천 프롬프트 회귀 테스트 (mock provider, API 키 불필요)"

prompts:
  - file://prompts/course-generator-v1.txt

providers:
  - file://providers/mock-course-generator.cjs

extensions:
  - file://extensions/prepare-course-input.cjs:beforeEach

defaultTest:
  assert:
    # 1) 유효한 JSON인지
    - type: is-json

    # 2) 입력은 서버가 계산한 거리 행렬과 점수만 사용해야 함
    - type: javascript
      value: file://assertions/input-contract.js

    # 3) 서버가 생성한 유효 코스 후보와 거리·점수 검증
    - type: javascript
      value: file://assertions/route-candidates-contract.js

    # 4) 코스 수는 1~3개
    - type: javascript
      value: file://assertions/routes-count.js

    # 5) 환각 방지: placeId가 후보 목록 안의 id에만 존재해야 함
    - type: javascript
      value: file://assertions/place-id-valid.js

    # 6) 방문 순서: places 개수와 카테고리 시퀀스가 visitOrder를 정확히 따라야 함
    - type: javascript
      value: file://assertions/visit-order.js

    # 7) 한 코스 내에 중복 placeId가 없어야 함 (카테고리 반복 구간 포함)
    - type: javascript
      value: file://assertions/no-duplicate-place-id.js

    # 8) 코스 간 차별성: 동일한 장소 조합을 중복 출력하지 않아야 함
    - type: javascript
      value: file://assertions/course-differentiation.js

    # 9) 필드 제약: places 항목에는 placeId, order, category 외 필드가 없어야 함
    - type: javascript
      value: file://assertions/field-constraints.js

    # 10) order는 각 코스 안에서 1부터 순차적이어야 함
    - type: javascript
      value: file://assertions/order-sequential.js

    # 11) routeId와 코스 이름(name)은 출력 규칙을 따라야 함
    - type: javascript
      value: file://assertions/route-id-name.js

    # 12) 서버가 계산한 routeCandidates 전체 목록 안에 있는 조합이어야 함
    - type: javascript
      value: file://assertions/route-candidate-membership.js

tests:
  # [테스트 케이스 1] 기본 정상 케이스: 10개 장소, 5단계 코스
  - description: "기본 정상 케이스"
    vars:
      inputJson: file://fixtures/input-normal.json
      expectedOutput: file://fixtures/input-normal.expected.json

  # [테스트 케이스 2] 카테고리 촉박 케이스: 액티비티 후보가 정확히 2개뿐인 상황
  # (LLM이 액티비티를 중복 사용하거나 생략하지 않는지, 가능한 서로 다른 코스가 1개뿐이라는 걸 인지하는지 검증)
  - description: "카테고리 후보 부족 (액티비티 정확히 2개)"
    vars:
      inputJson: file://fixtures/input-category-tight.json
      expectedOutput: file://fixtures/input-category-tight.expected.json

  # [테스트 케이스 3] 점수 vs 거리 충돌: 멀지만 score 10.0 vs 가깝지만 score 0.1
  - description: "선호도와 동선이 극단적으로 충돌하는 케이스"
    vars:
      inputJson: file://fixtures/input-score-distance-conflict.json
      expectedOutput: file://fixtures/input-score-distance-conflict.expected.json

  # [테스트 케이스 4] 긴 동선 케이스: 방문 순서가 7단계, 카테고리 반복 포함
  - description: "긴 동선 (7단계, 카테고리 반복)"
    vars:
      inputJson: file://fixtures/input-long-visit-order.json
      expectedOutput: file://fixtures/input-long-visit-order.expected.json
