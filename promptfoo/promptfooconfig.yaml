description: "코스 추천 프롬프트 회귀 테스트 (mock provider, API 키 불필요)"

prompts:
  - file://prompts/course-generator-v1.txt

providers:
  - file://providers/mock-course-generator.cjs

defaultTest:
  assert:
    # 1) 유효한 JSON인지
    - type: is-json

    # 2) 코스 수는 1~3개 (프롬프트: "총 최대 3개의 서로 다른 코스")
    - type: javascript
      value: |
        const routes = JSON.parse(output).routes;
        return Array.isArray(routes) && routes.length >= 1 && routes.length <= 3;

    # 3) 환각 방지: placeId가 후보 목록 안의 id에만 존재해야 함
    - type: javascript
      value: |
        const input = JSON.parse(context.vars.inputJson);
        const validIds = new Set(input.places.map((p) => p.id));
        const routes = JSON.parse(output).routes;
        return routes.every((r) => r.places.every((p) => validIds.has(p.placeId)));

    # 4) 방문 순서: places 개수와 카테고리 시퀀스가 visitOrder를 정확히 따라야 함
    - type: javascript
      value: |
        const input = JSON.parse(context.vars.inputJson);
        const routes = JSON.parse(output).routes;
        return routes.every((r) =>
          r.places.length === input.visitOrder.length &&
          r.places.every((p, i) => p.category === input.visitOrder[i])
        );

    # 5) 한 코스 내에 중복 placeId가 없어야 함 (카테고리 반복 구간 포함)
    - type: javascript
      value: |
        const routes = JSON.parse(output).routes;
        return routes.every((r) => {
          const ids = r.places.map((p) => p.placeId);
          return new Set(ids).size === ids.length;
        });

    # 6) 코스 간 차별성: 서로 다른 코스는 최소 1곳 이상 다른 장소(구성)를 가져야 함
    - type: javascript
      value: |
        const routes = JSON.parse(output).routes;
        return routes.every((r, i) => {
          const current = r.places.map((p) => p.placeId).sort().join(',');
          return routes.slice(0, i).every((other) =>
            other.places.map((p) => p.placeId).sort().join(',') !== current
          );
        });

    # 7) 필드 제약: places 항목에는 placeId, order, category 외 필드가 없어야 함
    - type: javascript
      value: |
        const routes = JSON.parse(output).routes;
        const expectedKeys = ['placeId', 'order', 'category'].sort();
        return routes.every((r) =>
          r.places.every((p) => {
            const keys = Object.keys(p).sort();
            return keys.length === expectedKeys.length &&
              expectedKeys.every((k, i) => keys[i] === k);
          })
        );

    # 8) order는 각 코스 안에서 1부터 순차적이어야 함
    - type: javascript
      value: |
        const routes = JSON.parse(output).routes;
        return routes.every((r) => r.places.every((p, i) => p.order === i + 1));

    # 9) routeId는 1부터 순차적이고, strategy는 비어있지 않으며 서로 달라야 함
    - type: javascript
      value: |
        const routes = JSON.parse(output).routes;
        const strategies = routes.map((r) => r.strategy);
        const idsSequential = routes.every((r, i) => r.routeId === i + 1);
        const strategiesValid = routes.every((r) => typeof r.strategy === 'string' && r.strategy.length > 0);
        return idsSequential && strategiesValid && new Set(strategies).size === strategies.length;

tests:
  # [테스트 케이스 1] 기본 정상 케이스: 10개 장소, 5단계 코스
  - description: "기본 정상 케이스"
    vars:
      inputJson: file://fixtures/input-normal.json
      expectedOutput: file://fixtures/input-normal.expected.json
    assert:
      # 전략별 총 score 비교 (참고용): 선호도우선 코스의 score 합이 다른 코스보다 높아야 함
      - type: javascript
        value: |
          const input = JSON.parse(context.vars.inputJson);
          const scores = new Map(input.places.map((p) => [p.id, p.score]));
          const routes = JSON.parse(output).routes;
          const preferenceRoute = routes.find((r) => r.strategy === '선호도우선');
          if (!preferenceRoute) return false;
          const preferenceSum = preferenceRoute.places.reduce((sum, p) => sum + scores.get(p.placeId), 0);
          return routes.every((r) => {
            const sum = r.places.reduce((acc, p) => acc + scores.get(p.placeId), 0);
            return sum <= preferenceSum;
          });

  # [테스트 케이스 2] 카테고리 촉박 케이스: 액티비티 후보가 정확히 2개뿐인 상황
  # (LLM이 액티비티를 중복 사용하거나 생략하지 않는지, 가능한 서로 다른 코스가 1개뿐이라는 걸 인지하는지 검증)
  - description: "카테고리 후보 부족 (액티비티 정확히 2개)"
    vars:
      inputJson: file://fixtures/input-category-tight.json
      expectedOutput: file://fixtures/input-category-tight.expected.json

  # [테스트 케이스 3] 점수 vs 거리 충돌: 멀지만 score 10.0 vs 가깝지만 score 0.1
  - description: "선호도와 동선이 극단적으로 충돌하는 케이스"
    vars:
      inputJson: file://fixtures/input-score-distance-conflict.json
      expectedOutput: file://fixtures/input-score-distance-conflict.expected.json

  # [테스트 케이스 4] 긴 동선 케이스: 방문 순서가 7단계, 카테고리 반복 포함
  - description: "긴 동선 (7단계, 카테고리 반복)"
    vars:
      inputJson: file://fixtures/input-long-visit-order.json
      expectedOutput: file://fixtures/input-long-visit-order.expected.json
