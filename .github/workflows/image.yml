name: Build and deploy image

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "nest-cli.json"
      - "tsconfig*.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/image.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "nest-cli.json"
      - "tsconfig*.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/image.yml"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/arm64
          tags: ghcr.io/dnd-side-project/dnd-15th-3-backend:ci-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-publish:
    name: Build, publish and update manifests (push)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ghcr.io/dnd-side-project/dnd-15th-3-backend:${{ github.ref_name }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # develop 환경은 Argo CD Image Updater가 태그를 자동 반영하므로
      # main 브랜치만 git에 태그를 기록한다.
      - name: Update the environment image tag
        if: github.ref_name == 'main'
        env:
          BRANCH: ${{ github.ref_name }}
          IMAGE_TAG: ${{ github.ref_name }}-${{ github.sha }}
        run: |
          case "$BRANCH" in
            develop) OVERLAY=develop ;;
            main) OVERLAY=main ;;
            *) echo "Unsupported deployment branch: $BRANCH" >&2; exit 1 ;;
          esac

          FILE="deploy/k8s/overlays/$OVERLAY/kustomization.yaml"
          sed -i -E "s#newTag: .*#newTag: $IMAGE_TAG#" "$FILE"

          git diff --exit-code || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git diff --cached --quiet && exit 0
          git commit -m "chore(deploy): update $OVERLAY image to $IMAGE_TAG"
          git push origin "HEAD:$BRANCH"
