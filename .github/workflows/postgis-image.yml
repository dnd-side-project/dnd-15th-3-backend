name: Build PostGIS image

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/postgis-image.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/postgis-image.yml"
  workflow_dispatch:

concurrency:
  group: postgis-image-${{ github.ref_name }}
  cancel-in-progress: true

env:
  POSTGIS_IMAGE: ghcr.io/dnd-side-project/dnd-15th-3-postgis
  POSTGIS_SOURCE_REF: 2bcd236e3af9ec6e668db51eb37162a79f0eaeaa
  POSTGIS_IMAGE_TAG: 17-3.5.7-arm64-2bcd236e3af9ec6e668db51eb37162a79f0eaeaa

jobs:
  build:
    name: Build and smoke-test (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout pinned PostGIS source
        uses: actions/checkout@v6
        with:
          repository: postgis/docker-postgis
          ref: ${{ env.POSTGIS_SOURCE_REF }}
          path: postgis-source
          sparse-checkout: |
            17-3.5/alpine
          sparse-checkout-cone-mode: true

      - uses: docker/setup-buildx-action@v3

      - name: Build ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./postgis-source/17-3.5/alpine
          push: false
          load: true
          platforms: linux/arm64
          tags: ${{ env.POSTGIS_IMAGE }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=postgis
          cache-to: type=gha,mode=max,scope=postgis

      - name: Verify PostGIS extension
        env:
          IMAGE_TAG: ci-${{ github.sha }}
        run: |
          set -euo pipefail

          container=postgis-smoke
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container" \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_DB=postgres \
            "${POSTGIS_IMAGE}:${IMAGE_TAG}"

          for attempt in $(seq 1 60); do
            if docker exec "$container" pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 2
          done

          version="$(docker exec "$container" psql -U postgres -d postgres -Atqc \
            "SELECT postgis_lib_version()")"
          echo "PostGIS version: $version"
          case "$version" in
            3.5.*) ;;
            *) echo "Unexpected PostGIS version: $version" >&2; exit 1 ;;
          esac

  build-and-publish:
    name: Build, smoke-test and publish (push)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout pinned PostGIS source
        uses: actions/checkout@v6
        with:
          repository: postgis/docker-postgis
          ref: ${{ env.POSTGIS_SOURCE_REF }}
          path: postgis-source
          sparse-checkout: |
            17-3.5/alpine
          sparse-checkout-cone-mode: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./postgis-source/17-3.5/alpine
          push: false
          load: true
          platforms: linux/arm64
          tags: |
            ${{ env.POSTGIS_IMAGE }}:${{ env.POSTGIS_IMAGE_TAG }}
            ${{ env.POSTGIS_IMAGE }}:${{ env.POSTGIS_IMAGE_TAG }}-${{ github.sha }}
          cache-from: type=gha,scope=postgis
          cache-to: type=gha,mode=max,scope=postgis

      - name: Verify PostGIS extension
        run: |
          set -euo pipefail

          container=postgis-smoke
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container" \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_DB=postgres \
            "${POSTGIS_IMAGE}:${POSTGIS_IMAGE_TAG}"

          for attempt in $(seq 1 60); do
            if docker exec "$container" pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 2
          done

          version="$(docker exec "$container" psql -U postgres -d postgres -Atqc \
            "SELECT postgis_lib_version()")"
          echo "PostGIS version: $version"
          case "$version" in
            3.5.*) ;;
            *) echo "Unexpected PostGIS version: $version" >&2; exit 1 ;;
          esac

      - name: Publish immutable image tags
        run: |
          set -euo pipefail
          docker push "${POSTGIS_IMAGE}:${POSTGIS_IMAGE_TAG}"
          docker push "${POSTGIS_IMAGE}:${POSTGIS_IMAGE_TAG}-${GITHUB_SHA}"
