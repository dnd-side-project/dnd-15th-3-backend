name: CI

on:
  push: &ci-trigger
    branches: [main, develop]
    paths:
      - "src/**"
      - "test/**"
      - "*.json"                   # package, biome, tsconfig, nest-cli
      - "*.toml"                   # mise
      - "*.yaml"                   # pnpm-lock, pnpm-workspace
      - ".github/workflows/ci.yml"
  pull_request: *ci-trigger

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (biome check)
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
