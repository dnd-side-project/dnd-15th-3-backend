name: ✨ 기능 요청
description: 새로운 기능이나 개선 사항을 제안해주세요
title: "[Feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: background
    attributes:
      label: 배경 / 문제
      description: 어떤 문제를 해결하고 싶은지 알려주세요
      placeholder: 게시글 목록을 볼 때 최신순으로만 볼 수 있어서 인기순 정렬이 필요해요
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결책
      description: 어떤 기능을 만들면 좋을지 설명해주세요 (API 형태까지 적어주면 더 좋아요)
      placeholder: GET /posts?sort=popular 형태로 정렬 옵션을 추가해요
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안 (선택)
      description: 다른 방법도 고려했다면 적어주세요

  - type: textarea
    id: etc
    attributes:
      label: 추가 정보 (선택)
      description: 참고할 링크, 스크린샷, 목업 등
