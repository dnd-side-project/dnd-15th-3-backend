name: 🐛 버그 리포트
description: 버그를 발견했을 때 작성해주세요
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 어떤 버그인지 간단히 설명해주세요
      placeholder: 로그인 API 호출 시 500 에러가 발생해요
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 버그를 재현하는 단계를 알려주세요
      placeholder: |
        1. POST /auth/login 요청
        2. 잘못된 비밀번호로 요청
        3. 500 에러 발생
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 원래 어떻게 동작해야 하나요?
      placeholder: 401 Unauthorized와 함께 에러 메시지가 반환되어야 해요
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 로그 / 스크린샷 (선택)
      description: 에러 로그, 응답 예시, 스크린샷 등을 붙여주세요
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: 환경 (선택)
      description: 어떤 환경에서 발생했나요?
      placeholder: 로컬 (macOS, Node 22) / 개발 서버 / 운영 서버
